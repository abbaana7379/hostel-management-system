<div class="page-content">
  <div class="page-header">
    <div>
      <h1>Room Management</h1>
      <p>Monitor and manage room allocation</p>
    </div>
    <button class="btn btn-primary" id="addRoomBtn">
      <i class="fas fa-plus"></i> Add Room
    </button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="available">Available</button>
    <button class="filter-btn" data-filter="partial">Partial</button>
    <button class="filter-btn" data-filter="full">Full</button>
  </div>

  <div class="rooms-grid" id="roomsGrid">
    <!-- Rooms will be loaded here -->
  </div>
</div>

<div id="roomModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="roomModalTitle">Add Room</h2>
      <button class="close-btn" data-modal="roomModal">&times;</button>
    </div>
    <form id="roomForm" class="form-grid">
      <div class="form-group">
        <label>Room Number *</label>
        <input type="text" name="roomNumber" placeholder="A-101" required />
      </div>
      <div class="form-group">
        <label>Capacity *</label>
        <input type="number" name="capacity" min="1" placeholder="2" required />
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select name="type" required>
          <option value="">Select type</option>
          <option>Single</option>
          <option>Double</option>
          <option>Triple</option>
          <option>Quad</option>
        </select>
      </div>
      <div class="form-group">
        <label>Floor *</label>
        <input type="number" name="floor" min="1" placeholder="1" required />
      </div>
      <div class="form-actions">
        <button type="reset" class="btn btn-outline">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Room</button>
      </div>
    </form>
  </div>
</div>
