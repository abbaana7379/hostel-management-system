<div class="page-content">
  <div class="page-header">
    <div>
      <h1>Student Management</h1>
      <p>Register and manage hostel students</p>
    </div>
    <button class="btn btn-primary" id="addStudentBtn">
      <i class="fas fa-plus"></i> Add Student
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Students List</h3>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="studentSearch" placeholder="Search by name or ID..." />
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Name</th>
              <th>Student ID</th>
              <th>Department</th>
              <th>Room</th>
              <th>Fee Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentsTable">
            <tr>
              <td colspan="6" class="text-center text-muted">No students found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="studentModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="studentModalTitle">Add Student</h2>
      <button class="close-btn" data-modal="studentModal">&times;</button>
    </div>
    <form id="studentForm" class="form-grid">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" placeholder="Enter full name" required />
      </div>
      <div class="form-group">
        <label>Student ID *</label>
        <input type="text" name="studentId" placeholder="HMS-101" required />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" placeholder="student@email.com" required />
      </div>
      <div class="form-group">
        <label>Phone *</label>
        <input type="tel" name="phone" placeholder="+91 98765 12345" required />
      </div>
      <div class="form-group">
        <label>Gender *</label>
        <select name="gender" required>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department *</label>
        <input type="text" name="department" placeholder="Computer Science" required />
      </div>
      <div class="form-group">
        <label>Room *</label>
        <select name="room" id="studentRoomSelect" required>
          <option value="">Select room</option>
        </select>
      </div>
      <div class="form-group">
        <label>Guardian Name *</label>
        <input type="text" name="guardian" placeholder="Guardian name" required />
      </div>
      <div class="form-group full-width">
        <label>Address</label>
        <textarea name="address" placeholder="Full address" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Fee Status *</label>
        <select name="feeStatus" required>
          <option value="Paid">Paid</option>
          <option value="Pending">Pending</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="reset" class="btn btn-outline">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Student</button>
      </div>
    </form>
  </div>
</div>
