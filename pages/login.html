<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <i class="fas fa-building"></i>
      </div>
      <h1>Hostel Manager</h1>
      <p>Centralized Management Portal</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label>
          <i class="fas fa-user"></i>
          Username or Email
        </label>
        <input type="text" name="username" placeholder="admin@hostel.com" required />
      </div>

      <div class="form-group">
        <label>
          <i class="fas fa-lock"></i>
          Password
        </label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>

      <div class="form-group checkbox">
        <input type="checkbox" name="remember" id="remember" />
        <label for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="login-footer">
      <p>Demo Credentials:</p>
      <small>Admin: admin@hostel.com / password: admin123</small>
      <small>Manager: manager@hostel.com / password: manager123</small>
    </div>
  </div>

  <div class="login-bg">
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
  </div>
</div>
