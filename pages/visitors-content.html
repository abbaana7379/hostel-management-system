<div class="page-content">
  <div class="page-header">
    <div>
      <h1>Visitor Management</h1>
      <p>Log and track visitor access</p>
    </div>
    <button class="btn btn-primary" id="addVisitorBtn">
      <i class="fas fa-plus"></i> Log Visitor
    </button>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Visitor Logs</h3>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="visitorSearch" placeholder="Search by name or host..." />
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Visitor Name</th>
              <th>Purpose</th>
              <th>Host Student</th>
              <th>Check-in Time</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="visitorsTable">
            <tr>
              <td colspan="5" class="text-center text-muted">No visitor logs found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="visitorModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="visitorModalTitle">Log Visitor</h2>
      <button class="close-btn" data-modal="visitorModal">&times;</button>
    </div>
    <form id="visitorForm" class="form-grid">
      <div class="form-group">
        <label>Visitor Name *</label>
        <input type="text" name="name" placeholder="Enter visitor name" required />
      </div>
      <div class="form-group">
        <label>Purpose *</label>
        <input type="text" name="purpose" placeholder="Reason for visit" required />
      </div>
      <div class="form-group">
        <label>Host Student *</label>
        <select name="host" id="visitorHostSelect" required>
          <option value="">Select host</option>
        </select>
      </div>
      <div class="form-group">
        <label>Check-in Time *</label>
        <input type="datetime-local" name="checkIn" required />
      </div>
      <div class="form-actions">
        <button type="reset" class="btn btn-outline">Cancel</button>
        <button type="submit" class="btn btn-primary">Log Visitor</button>
      </div>
    </form>
  </div>
</div>
